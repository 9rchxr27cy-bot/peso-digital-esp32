; Peso digital - ESP32-S3 + placa de hoverboard (EFeru FOC, modo torque)
;
;   pio run  -e native -t exec   -> roda o simulador no PC e grava CSVs em out/
;   pio test -e native           -> testes dos modos e da seguranca, sem hardware
;
; O ambiente do ESP32-S3 entra quando o firmware for escrito; ele usa lib/core
; (portatil) e ignora lib/sim.

[platformio]
default_envs = native

[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -O2
build_src_filter = +<sim_main.cpp>
test_framework = unity
